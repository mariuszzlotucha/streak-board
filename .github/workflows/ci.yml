name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # Docs-only PRs skip the slow jobs at job level, never with `paths-ignore` on the trigger: a workflow skipped by a
  # path filter reports nothing, so the required check `integration` stays pending and the PR cannot merge, while a
  # job skipped by `if:` reports as skipped, which satisfies it. The `if:` on those jobs fails safe: they run unless
  # this job answers `false` (a failed `changes` job leaves the output empty).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only "origin/$BASE_REF...HEAD" > changed-files.txt
            cat changed-files.txt
            if [ -s changed-files.txt ] && ! grep -qvE '^context/|\.md$' changed-files.txt; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  ci:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npx astro check
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  smoke:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: npm ci
      - name: Start local Supabase
        run: |
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' > supabase.env
      - name: Configure secrets for build and preview
        run: |
          source supabase.env
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env
          cp .env .dev.vars
      - run: npm run build
      - name: Run smoke test against production preview
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          BASE_URL=http://localhost:4321 npm run smoke
      - if: always()
        run: supabase stop --no-backup

  integration:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: npm ci
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
      - name: Run integration tests (Vitest)
        run: npm test
      - name: Run RLS scenario checks (SQL)
        run: docker exec -i supabase_db_10x-astro-starter psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 < supabase/checks/rls-scenarios.sql
      - if: always()
        run: supabase stop --no-backup

  release:
    needs: [ci, smoke, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: npm ci
      - name: Link hosted Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      - name: List migrations
        run: supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Build before touching the schema, so a build failure cannot leave the database ahead of the code.
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # The approval in the `production` environment is the gate, so the CLI prompt is skipped.
      - name: Apply pending migrations
        run: supabase db push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Exact status checks: plain `curl -f` would also pass on a wrong 200.
      - name: Check the live deployment
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          base="${PRODUCTION_URL%/}"
          root=""
          for i in $(seq 1 10); do
            root=$(curl -s -o /dev/null -w '%{http_code}' "$base/" || true)
            [ "$root" = "200" ] && break
            sleep 3
          done
          [ "$root" = "200" ] || { echo "Expected 200 from $base/, got $root"; exit 1; }
          read -r code location < <(curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' "$base/dashboard")
          [ "$code" = "302" ] || { echo "Expected 302 from $base/dashboard, got $code"; exit 1; }
          case "$location" in
            */auth/signin) ;;
            *) echo "Expected /dashboard to redirect to /auth/signin, got $location"; exit 1 ;;
          esac
          read -r code location < <(curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' "$base/auth/callback")
          [ "$code" = "302" ] || { echo "Expected 302 from $base/auth/callback, got $code"; exit 1; }
          case "$location" in
            */auth/signin?error=link_expired) ;;
            *) echo "Expected /auth/callback to redirect to /auth/signin?error=link_expired, got $location"; exit 1 ;;
          esac
          # The Google flow, anonymously and in two hops. The start route has to reach Supabase's authorize endpoint, and that
          # endpoint has to redirect to Google: a disabled provider or a missing client id or secret answers a JSON 400
          # instead. Each hop is tried up to 3 times, 3 s apart, and only the third failed try fails the step. Hop 2 makes
          # Supabase store one short-lived flow state per run.
          probe() { curl -s -o /dev/null --max-time 20 -w '%{http_code} %{redirect_url}' "$@" || true; }
          authorize=""
          for i in 1 2 3; do
            read -r code location <<< "$(probe -X POST -d '' -H "Origin: $base" "$base/api/auth/google")"
            case "$code $location" in
              "302 https://"*"/auth/v1/authorize?provider=google"*) authorize="$location"; break ;;
            esac
            if [ "$i" = "3" ]; then
              echo "Expected $base/api/auth/google to redirect to https://*/auth/v1/authorize?provider=google*, got $code $location"
              exit 1
            fi
            sleep 3
          done
          for i in 1 2 3; do
            read -r code location <<< "$(probe "$authorize")"
            case "$code $location" in
              "302 https://accounts.google.com/"*) break ;;
            esac
            if [ "$i" = "3" ]; then
              echo "Expected the Supabase authorize URL to redirect to https://accounts.google.com/*, got $code $location"
              exit 1
            fi
            sleep 3
          done
