# .github/workflows/claude-review.yml
# On-demand, advisory Claude review: runs only when the claude-review label is added
# to a PR whose branch lives in this repository (fork PRs get no secrets). The merge
# gate stays with review.yml (`ai-review`). The label is removed after the run, so
# adding it again re-runs the review.
# Concurrency is set on the job, not the workflow: a job skipped by its `if:` never
# joins the group, so another label added to the PR cannot cancel a running review.
name: Claude Code Review

on:
  pull_request:
    branches: [master]
    types: [labeled]

jobs:
  claude-review:
    name: claude-review
    if: github.event.label.name == 'claude-review' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    permissions:
      contents: read
      pull-requests: write
      issues: write # labels live on the issues API
      # No id-token: github_token and the OAuth token are passed explicitly, so the action's OIDC exchange is unused.

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # Claude reads this checkout, so no job token stays in its git config (as in review.yml).
          persist-credentials: false

      # The subprocess scrub below needs bubblewrap on Linux, which the action installs only together with
      # allowed_non_write_users. This mirrors its "Install subprocess isolation dependencies" step: bubblewrap
      # and socat, and unprivileged user namespaces allowed again where AppArmor restricts them (Ubuntu 24.04+).
      - name: Install subprocess isolation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run Claude review
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        env:
          # The action passes this on to Claude Code, which keeps credentials such as the OAuth token
          # out of the commands it runs (GH_TOKEN, the short-lived job token, stays for gh).
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          # A Claude subscription token (`claude setup-token`), so the review uses the subscription, not API credits.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # `--setting-sources user` keeps the repository's Claude settings out of CI: .claude/settings.json
          # is a developer allow-list (node, npm, npx, Write, Edit). Without the tools below Claude cannot
          # post the inline and summary comments the prompt asks for.
          claude_args: |
            --setting-sources user
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Jesteś senior code reviewerem dla projektu Astro. Wykonaj dokładne review aktualnego pull requesta na podstawie diffu oraz kontekstu dostępnego w repozytorium.

            Cel review:
            - wykryć realne błędy i regresje,
            - sprawdzić poprawność renderowania po stronie serwera i klienta,
            - znaleźć problemy bezpieczeństwa i wydajności,
            - ocenić jakość testów,
            - ograniczyć liczbę fałszywych alarmów.

            Najpierw zapoznaj się z:
            - package.json,
            - konfiguracją Astro,
            - istniejącą strukturą katalogów,
            - lokalnymi konwencjami projektu z CLAUDE.md (w CI nie ładuje się automatycznie, przeczytaj go),
            - używanymi integracjami i frameworkami.

            Nie zakładaj obecności technologii, których nie ma w repozytorium. Szczególnie nie zakładaj użycia NestJS, Spring Boot ani innego backendowego frameworka.

            Przeanalizuj zmianę w następujących obszarach:

            1. Poprawność Astro
               - Czy zmiana poprawnie wykorzystuje strony, layouty, komponenty i endpointy Astro?
               - Czy routing oparty na strukturze src/pages działa poprawnie?
               - Sprawdź parametry dynamicznych tras, getStaticPaths oraz zachowanie dla brakujących danych.
               - Sprawdź, czy kod wykonywany na serwerze nie trafia przypadkowo do bundla klienta.
               - Sprawdź poprawne rozdzielenie kodu server-side i client-side.
               - Zwróć uwagę na błędne założenia dotyczące renderowania statycznego, SSR i prerenderingu.
               - Sprawdź poprawność użycia frontmatter w plikach .astro.

            2. Komponenty Astro i UI
               - Sprawdź przekazywanie propsów oraz ich typowanie.
               - Zwróć uwagę na błędne lub niepotrzebne warunkowe renderowanie.
               - Sprawdź poprawność slotów, layoutów i zagnieżdżania komponentów.
               - Oceń, czy zmiana nie psuje istniejących stanów: loading, error, empty state i success.
               - Sprawdź semantykę HTML oraz dostępność interfejsu.
               - Zwróć uwagę na formularze, etykiety, focus, nawigację klawiaturą i komunikaty dla technologii asystujących.

            3. Komponenty interaktywne i wyspy
               - Jeśli repozytorium używa Reacta, sprawdź poprawność komponentów React osadzanych w Astro.
               - Oceń dobór dyrektyw client:client, client:load, client:idle, client:visible oraz client:only.
               - Zgłaszaj użycie client:only tylko wtedy, gdy jest rzeczywiście uzasadnione.
               - Sprawdź, czy komponent interaktywny nie jest renderowany wyłącznie po stronie serwera mimo potrzeby obsługi zdarzeń w przeglądarce.
               - Sprawdź problemy z hookami, ich zależnościami, stale closure, cleanupem i stanem asynchronicznym.
               - Zwróć uwagę na niepotrzebne wysyłanie dużych fragmentów UI do klienta.
               - Sprawdź, czy granica między kodem Astro i kodem komponentu React jest poprawna.

            4. Dane, API i bezpieczeństwo
               - Sprawdź walidację danych pochodzących z parametrów URL, formularzy, cookies, nagłówków i zewnętrznych API.
               - Szukaj między innymi XSS, SSRF, command injection, wycieku sekretów i błędów autoryzacji.
               - Sprawdź, czy dane przeznaczone wyłącznie dla serwera nie są przekazywane do klienta.
               - Zwróć uwagę na niebezpieczne użycie dangerouslySetInnerHTML, set:html oraz renderowanie nieufnego HTML.
               - Sprawdź, czy sekrety i prywatne zmienne środowiskowe nie trafiają do kodu klienckiego.
               - Nie zgłaszaj problemu tylko dlatego, że potencjalnie istnieje. Opisz konkretny scenariusz wykorzystania i skutek.

            5. Wydajność
               - Sprawdź, czy zmiana nie zwiększa niepotrzebnie JavaScriptu wysyłanego do przeglądarki.
               - Oceń użycie dyrektyw client:* oraz możliwość pozostawienia logiki po stronie serwera.
               - Zwróć uwagę na duże obrazy, brak optymalizacji obrazów, niepotrzebne requesty i pobieranie danych w pętli.
               - Sprawdź, czy dane nie są pobierane wielokrotnie podczas renderowania.
               - Zwróć uwagę na problemy z cache, prerenderingiem i generowaniem stron, jeśli dotyczą zmienionych plików.

            6. Typy i jakość kodu
               - Sprawdź typowanie propsów, danych z API, parametrów tras i wyników funkcji.
               - Zwróć uwagę na nieuzasadnione użycie any, rzutowań oraz ignorowanie błędów TypeScript.
               - Sprawdź nazwy, strukturę komponentów i zgodność z konwencjami repozytorium.
               - Wykryj duplikację, martwy kod i niepotrzebną komplikację.
               - Nie proponuj refaktoryzacji wyłącznie na podstawie osobistych preferencji.

            7. Testy i build
               - Sprawdź, czy zmiana wymaga nowych lub zmodyfikowanych testów.
               - Oceń, czy testy pokrywają główny scenariusz i istotne przypadki brzegowe.
               - Sprawdź, czy testy mogą przechodzić mimo błędnej implementacji.
               - Uwzględnij wpływ zmiany na npm run build, linting, TypeScript oraz istniejące skrypty z package.json.
               - Nie zgłaszaj braku testów automatycznie, jeśli w repozytorium nie ma odpowiedniej infrastruktury testowej lub zmiana nie wymaga testu.

            Zasady zgłaszania uwag:
            - Zgłaszaj wyłącznie problemy mające praktyczny wpływ na poprawność, bezpieczeństwo, wydajność, dostępność lub utrzymanie kodu.
            - Nie zgłaszaj ogólników, preferencji stylistycznych ani hipotetycznych problemów bez uzasadnienia.
            - Nie powtarzaj uwag dotyczących tego samego problemu.
            - Priorytetem jest precyzja, nie liczba komentarzy.
            - Każdą uwagę przypisz do konkretnego fragmentu zmienionego kodu.
            - Wyjaśnij problem, jego skutek oraz rekomendowaną poprawkę.
            - Jeśli nie znajdziesz istotnych problemów, napisz to jasno i nie twórz sztucznych uwag.

            Klasyfikacja ważności:
            - CRITICAL: bezpośrednie ryzyko utraty danych, przejęcia uprawnień, ujawnienia sekretów albo poważnej awarii produkcyjnej.
            - HIGH: poważny błąd funkcjonalny, luka bezpieczeństwa albo regresja dotycząca typowego scenariusza.
            - MEDIUM: problem wpływający na część użytkowników, niezawodność, wydajność, dostępność lub utrzymanie.
            - LOW: mniejszy problem, który warto poprawić, ale nie blokuje wdrożenia.

            Format każdej uwagi:
            - poziom ważności,
            - problem,
            - konkretny skutek,
            - rekomendowana poprawka.

            Uwagi dotyczące konkretnych linii publikuj jako komentarze inline w pull requeście.

            Na końcu opublikuj komentarz podsumowujący, zawierający:
            - ogólny werdykt: APPROVED, NEEDS ATTENTION albo REJECTED,
            - krótkie uzasadnienie,
            - listę najważniejszych problemów według ważności,
            - informację, czy wymagane są dodatkowe testy,
            - informację, czy zmiana wpływa na rendering server-side, rendering client-side, routing, bezpieczeństwo lub wydajność.

            Nie modyfikuj kodu i nie twórz commitów. Wykonaj wyłącznie review oraz opublikuj jego wynik w pull requeście.

            Gałąź PR jest już pobrana w bieżącym katalogu roboczym.
            Komentarz podsumowujący publikuj przez `gh pr comment`, a uwagi do konkretnych linii przez `mcp__github_inline_comment__create_inline_comment` (z `confirmed: true`).

      - name: Remove trigger label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if ! out=$(gh api --method DELETE "repos/$REPO/issues/$PR/labels/claude-review" --silent 2>&1); then
            case "$out" in
              *"HTTP 404"*) ;; # the label was already removed
              *) echo "$out" >&2; exit 1 ;;
            esac
          fi
