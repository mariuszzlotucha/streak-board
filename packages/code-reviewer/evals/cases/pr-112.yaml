      Phase 2 of 2 of `context/changes/tool-loop-agent/plan.md`, plus the full-plan review fixes.

      ## What changed
      - **CLI** (`packages/code-reviewer/review.ts`): loads `.env`, picks the model with `resolveReviewerModel()` (`REVIEWER_MODEL` override), prints the `ReviewResult` JSON on stdout and one usage/cost line on stderr (`model=… finishReason=… input_tokens=… output_tokens=… total_tokens=… cost_usd=…`). A `ReviewRunError` still prints the usage line before the error; exit 1 on any failure.
