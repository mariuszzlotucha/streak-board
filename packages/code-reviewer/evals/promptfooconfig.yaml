# promptfooconfig.yaml — the default run: the reviewer of this checkout on z-ai/glm-5.1, every case three times.
# Run: npm run --prefix packages/code-reviewer/evals eval (see README.md). The provider builds its own prompt
# from each case, so the prompt below is only a label.
description: Code reviewer — default run (glm-5.1, x3)

prompts: ["code review case"]

tests: file://cases/*.yaml

defaultTest:
  options:
    # Grader of the llm-rubric assertions.
    provider: openrouter:anthropic/claude-sonnet-5.5
  assert:
    # Weight 0: never fails a case, only records whether the model's verdict and the score rule agree.
    - type: javascript
      weight: 0
      metric: verdict-agreement
      value: output.outcome !== "reviewed" || output.modelVerdict === output.ruleVerdict

providers:
  - id: file://provider.ts
    label: glm-5.1
    config:
      model: z-ai/glm-5.1

# Top-level `repeat` passes validation but is ignored; the count lives here (`--repeat` overrides it).
evaluateOptions:
  maxConcurrency: 4
  repeat: 3
